[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finqa-llm-evaluation-lab"
version = "0.1.0"
description = "A reproducible evaluation lab for financial question answering with LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "matplotlib>=3.9",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]